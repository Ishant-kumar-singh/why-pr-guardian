services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_HOST_PORT:-6379}:6379"
      - "${FALKORDB_UI_HOST_PORT:-3000}:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
